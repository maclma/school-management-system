<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management - Login</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { background: white; border-radius: 8px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-width: 400px; width: 100%; }
        .login-container h1 { color: #2c3e50; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #2c3e50; font-weight: 500; margin-bottom: 8px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; }
        input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 20px; }
        button:hover { background: #5568d3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .message { margin-bottom: 20px; padding: 12px; border-radius: 4px; text-align: center; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .links { text-align: center; margin-top: 20px; }
        .links a { color: #667eea; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
        .loading { display: inline-block; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🏫 School Management System</h1>
        <div id="message"></div>
        <div id="redirect-check" style="text-align: center; color: #667eea; margin-bottom: 15px; font-size: 14px;"></div>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required value="admin@school.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required value="admin">
            </div>
            <button type="submit" id="login-btn">Login</button>
        </form>
        <div class="links">
            <p>Don't have an account? <a href="register.html">Register here</a></p>
            <p><a href="test-integration.html">Test API Integration</a></p>
        </div>
    </div>

    <!-- Include API client -->
    <script src="api.js"></script>
    <script src="ui.js"></script>
    <script>
        // Check if already logged in (redirect to dashboard)
        window.addEventListener('load', function() {
            const token = localStorage.getItem('sms_token');
            if (token) {
                document.getElementById('redirect-check').textContent = '✅ Already logged in! Redirecting...';
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 500);
            }
        });

        const form = document.getElementById('login-form');
        const messageEl = document.getElementById('message');
        const btn = document.getElementById('login-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            messageEl.textContent = '';
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showMessage('Please enter email and password', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                console.log('Attempting login...');
                const body = await window.api.login(email, password);
                console.log('Login response:', body);

                const token = (body.data && body.data.token) || body.token || '';
                if (!token) {
                    showMessage('Login succeeded but token missing', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Login';
                    return;
                }

                localStorage.setItem('sms_token', token);
                if (body.data && body.data.user) {
                    localStorage.setItem('sms_user', JSON.stringify(body.data.user));
                }

                showMessage('Logged in successfully! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
            } catch (err) {
                console.error('Login error:', err);
                const msgText = (err && err.message) || 'Network or server error';
                showMessage(msgText, 'error');
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        });

        function showMessage(text, type) {
            messageEl.className = `message ${type}`;
            messageEl.textContent = text;
            messageEl.style.display = 'block';
        }
    </script>
</body>
</html>
